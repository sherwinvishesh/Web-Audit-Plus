name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the store zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run test
      - run: npm run zip
      - name: Verify the zip
        run: |
          set -e
          zip="$(ls output/*-chrome.zip)"
          rm -rf /tmp/zipcheck && mkdir /tmp/zipcheck && unzip -q "$zip" -d /tmp/zipcheck
          node -e "
            const m = require('/tmp/zipcheck/manifest.json');
            const v = require('./package.json').version;
            if (m.version !== v) throw new Error('manifest version ' + m.version + ' != ' + v);
            for (const s of ['16','32','48','128']) if (!m.icons[s]) throw new Error('missing icon ' + s);
            if (m.description.length > 132) throw new Error('description longer than 132 characters');
            console.log('manifest ok:', m.name, m.version);
          "
          ls -l "$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: store-zip
          path: output/*-chrome.zip
          retention-days: 30
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/*-chrome.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Web Audit+ $GITHUB_REF_NAME" \
            --generate-notes
